name: Physical App Attest evidence

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full latchway-ios-sdk commit embedded in the release candidate
        required: true
        type: string

permissions: {}

concurrency:
  group: physical-app-attest-production
  cancel-in-progress: false

jobs:
  authorize-source:
    name: Authorize exact iOS source without executing candidate code
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact iOS source as data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Create the run-bound source authorization without executing repository code
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          root="$RUNNER_TEMP/latchway-app-attest-source"
          install -d -m 0700 "$root"
          tree=$(git rev-parse 'HEAD^{tree}')
          [[ "$tree" =~ ^[0-9a-f]{40,64}$ ]]
          jq -n -S \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_COMMIT" \
            --arg tree "$tree" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg ref "$GITHUB_REF" \
            '{schema_version:"latchway.physical-source-authorization.v1",repository:$repository,source:{commit:$commit,tree:$tree},workflow:{run_id:$run_id,run_attempt:$run_attempt,ref:$ref},audiences:["ios-app-attest"]}' \
            > "$root/source-authorization.json"
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_COMMIT" \
            --arg tree "$tree" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" '
              .schema_version == "latchway.physical-source-authorization.v1" and
              .repository == $repository and .source == {commit:$commit,tree:$tree} and
              .workflow.run_id == $run_id and .workflow.run_attempt == $run_attempt and
              .workflow.ref == "refs/heads/main" and .audiences == ["ios-app-attest"]
            ' "$root/source-authorization.json" >/dev/null
      - name: Attest the exact run-bound source authorization
        id: source-attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/latchway-app-attest-source/source-authorization.json
      - name: Close the source authorization handoff
        env:
          BUNDLE_PATH: ${{ steps.source-attest.outputs.bundle-path }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/latchway-app-attest-source"
          test -f "$BUNDLE_PATH" && test ! -L "$BUNDLE_PATH"
          install -m 0600 -- "$BUNDLE_PATH" "$root/source-authorization.sigstore.json"
          cd "$root"
          sha256sum source-authorization.json source-authorization.sigstore.json > SHA256SUMS
          test "$(find . -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          test -z "$(find . -mindepth 1 ! -type f -print -quit)"
      - name: Retain the one-run source authorization
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-attest-source-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-app-attest-source/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  app-attest-production:
    name: Production App Attest on physical Apple hardware
    needs: authorize-source
    environment: app-attest-production
    runs-on: [self-hosted, macOS, latchway-physical-ios, latchway-ephemeral-jit]
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify the fresh one-job collector lease before receiving source
        shell: bash
        env:
          COLLECTOR_TRUST_ROOT_PEM: ${{ vars.LATCHWAY_COLLECTOR_TRUST_ROOT_PEM }}
          COLLECTOR_TRUST_ROOT_SHA256: ${{ vars.LATCHWAY_COLLECTOR_TRUST_ROOT_SHA256 }}
          REGISTRATION_GRANT_SHA256: ${{ vars.LATCHWAY_REGISTRATION_DEVICE_GRANT_SHA256 }}
          ASSERTION_GRANT_SHA256: ${{ vars.LATCHWAY_ASSERTION_DEVICE_GRANT_SHA256 }}
          EXPECTED_ARTIFACT_SHA256: ${{ vars.LATCHWAY_IOS_APP_BINARY_SHA256 }}
          EXPECTED_BUNDLE_TREE_SHA256: ${{ vars.LATCHWAY_IOS_APP_BUNDLE_TREE_SHA256 }}
          EXPECTED_WIDGET_SHA256: ${{ vars.LATCHWAY_IOS_WIDGET_BINARY_SHA256 }}
          EXPECTED_SHARE_SHA256: ${{ vars.LATCHWAY_IOS_SHARE_BINARY_SHA256 }}
          EXPECTED_ACTION_SHA256: ${{ vars.LATCHWAY_IOS_ACTION_BINARY_SHA256 }}
          EXPECTED_APPLICATION_ID: ${{ vars.LATCHWAY_APPLICATION_ID }}
          EXPECTED_ENVIRONMENT: ${{ vars.LATCHWAY_ENVIRONMENT }}
          EXPECTED_IDENTITY_PROVIDER: ${{ vars.LATCHWAY_IDENTITY_PROVIDER }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BUNDLE_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$RUNNER_NAME" = "latchway-ios-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -print -quit)"
          if env | grep -Eq '^(ACTIONS_ID_TOKEN_REQUEST_URL|ACTIONS_ID_TOKEN_REQUEST_TOKEN|GITHUB_TOKEN|GH_TOKEN|NPM_TOKEN|NODE_AUTH_TOKEN|DOCKER_AUTH_CONFIG|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|GOOGLE_APPLICATION_CREDENTIALS|AZURE_CLIENT_SECRET|CLOUDFLARE_API_TOKEN)='; then
            echo "prohibited credential class is present on physical collector" >&2
            exit 1
          fi
          lease=/etc/latchway/physical-collector/lease.json
          signature=/etc/latchway/physical-collector/lease.sig
          hook=/usr/local/libexec/latchway-physical-collector-finalize
          component_observer=/usr/local/libexec/latchway-ios-component-evidence-observer
          for path in "$lease" "$signature" "$hook" "$component_observer"; do
            test -f "$path" && test ! -L "$path"
            case "$RUNNER_OS" in
              macOS)
                test "$(stat -f '%Su' "$path")" = root
                mode=$(stat -f '%OLp' "$path")
                ;;
              Linux)
                test "$(stat -c '%U' "$path")" = root
                mode=$(stat -c '%a' "$path")
                ;;
              *) exit 1 ;;
            esac
            (( (8#$mode & 0022) == 0 ))
          done
          test -x "$hook"
          test -x "$component_observer"
          trust_root="$RUNNER_TEMP/latchway-collector-trust-root.pem"
          isolation="$RUNNER_TEMP/latchway-app-attest-isolation"
          umask 077
          printf '%s\n' "$COLLECTOR_TRUST_ROOT_PEM" > "$trust_root"
          [[ "$COLLECTOR_TRUST_ROOT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(shasum -a 256 "$trust_root" | awk '{print $1}')" = "$COLLECTOR_TRUST_ROOT_SHA256"
          openssl dgst -sha256 -verify "$trust_root" -signature "$signature" "$lease"
          now=$(date +%s)
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" \
            --arg runner "$RUNNER_NAME" \
            --arg registration_grant "$REGISTRATION_GRANT_SHA256" \
            --arg assertion_grant "$ASSERTION_GRANT_SHA256" \
            --arg artifact "$EXPECTED_ARTIFACT_SHA256" \
            --arg bundle_tree "$EXPECTED_BUNDLE_TREE_SHA256" \
            --arg widget "$EXPECTED_WIDGET_SHA256" \
            --arg share "$EXPECTED_SHARE_SHA256" \
            --arg action "$EXPECTED_ACTION_SHA256" \
            --arg application "$EXPECTED_APPLICATION_ID" \
            --arg environment "$EXPECTED_ENVIRONMENT" \
            --arg identity_provider "$EXPECTED_IDENTITY_PROVIDER" \
            --argjson now "$now" '
              .schema_version == "latchway.physical-collector-lease.v1" and
              .repository == $repository and .source_commit == $commit and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt,job:$job,audience:"ios-app-attest"} and
              .runner.name == $runner and .runner.ephemeral == true and .runner.jit == true and
              .runner.max_jobs == 1 and .runner.fresh_boot == true and
              .runner.clean_workspace == true and .runner.repository_scope == $repository and
              .runner.device_exclusive == true and .runner.destroy_after_job == true and
              (.runner.image_digest | test("^sha256:[0-9a-f]{64}$")) and
              (.runner.boot_id_sha256 | test("^[0-9a-f]{64}$")) and
              .credentials == {long_lived:false,organization:false,administration:false,registry:false,oidc:false} and
              .supervisor == {private_key_isolated:true,caller_supplied_claims_accepted:false,independent_device_verification:true,independent_provider_verification:true,independent_component_verification:true,gateway_run_receipt_verification:true,one_use_invocation:true,out_of_band_watchdog:true,destroy_on_disconnect:true} and
              (.grants | keys) == ["assertion","registration"] and
              (.grants.registration | keys) == ["application_id","audience","environment","expires_at_unix","identity_provider","issued_at_unix","jti_sha256","run_attempt","run_id","sha256","single_use","source_commit"] and
              (.grants.assertion | keys) == ["application_id","audience","environment","expires_at_unix","identity_provider","issued_at_unix","jti_sha256","run_attempt","run_id","sha256","single_use","source_commit"] and
              .grants.registration.audience == "latchway-physical-evidence/ios-app-attest/registration" and
              .grants.assertion.audience == "latchway-physical-evidence/ios-app-attest/assertion" and
              .grants.registration.source_commit == $commit and .grants.assertion.source_commit == $commit and
              .grants.registration.application_id == $application and .grants.assertion.application_id == $application and
              .grants.registration.environment == $environment and .grants.assertion.environment == $environment and
              .grants.registration.identity_provider == $identity_provider and .grants.assertion.identity_provider == $identity_provider and
              .grants.registration.run_id == $run_id and .grants.assertion.run_id == $run_id and
              .grants.registration.run_attempt == $run_attempt and .grants.assertion.run_attempt == $run_attempt and
              .grants.registration.sha256 == $registration_grant and .grants.assertion.sha256 == $assertion_grant and
              $registration_grant != $assertion_grant and
              .grants.registration.single_use == true and .grants.assertion.single_use == true and
              (.grants.registration.jti_sha256 | test("^[0-9a-f]{64}$")) and
              (.grants.assertion.jti_sha256 | test("^[0-9a-f]{64}$")) and
              .grants.registration.jti_sha256 != .grants.assertion.jti_sha256 and
              (.grants.registration.issued_at_unix | type == "number") and
              (.grants.registration.expires_at_unix | type == "number") and
              .grants.registration.issued_at_unix >= .issued_at_unix and
              .grants.registration.issued_at_unix <= $now and
              .grants.registration.expires_at_unix >= $now and
              .grants.registration.expires_at_unix > .grants.registration.issued_at_unix and
              (.grants.registration.expires_at_unix - .grants.registration.issued_at_unix) <= 300 and
              (.grants.assertion.issued_at_unix | type == "number") and
              (.grants.assertion.expires_at_unix | type == "number") and
              .grants.assertion.issued_at_unix >= .issued_at_unix and
              .grants.assertion.issued_at_unix <= $now and
              .grants.assertion.expires_at_unix >= $now and
              .grants.assertion.expires_at_unix > .grants.assertion.issued_at_unix and
              (.grants.assertion.expires_at_unix - .grants.assertion.issued_at_unix) <= 300 and
              .grants.registration.expires_at_unix <= .expires_at_unix and
              .grants.assertion.expires_at_unix <= .expires_at_unix and
              .candidate.artifacts == {ios_app_binary_sha256:$artifact,ios_app_bundle_tree_sha256:$bundle_tree,ios_widget_binary_sha256:$widget,ios_share_binary_sha256:$share,ios_action_binary_sha256:$action} and
              .candidate.configuration == {application_id:$application,environment:$environment,identity_provider:$identity_provider} and
              (.candidate | keys) == ["artifacts","configuration"] and
              (.issued_at_unix | type == "number") and (.expires_at_unix | type == "number") and
              .issued_at_unix <= $now and .expires_at_unix >= $now and
              (.expires_at_unix - .issued_at_unix) <= 3600
            ' "$lease" >/dev/null
          install -d -m 0700 "$isolation"
          install -m 0600 "$lease" "$isolation/collector-lease.json"
          install -m 0600 "$signature" "$isolation/collector-lease.sig"
          printf '%s\n' "$trust_root" > "$RUNNER_TEMP/latchway-collector-trust-root-path"
      - name: Download the GitHub-hosted source authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-attest-source-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-app-attest-source
      - name: Verify the exact source authorization before checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/latchway-app-attest-source"
          test -d "$root" && test ! -L "$root"
          test -z "$(find "$root" -mindepth 1 ! -type f -print -quit)"
          test "$(find "$root" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          (cd "$root" && shasum -a 256 -c SHA256SUMS)
          gh attestation verify "$root/source-authorization.json" \
            --bundle "$root/source-authorization.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/physical-app-attest.yml" \
            --source-digest "$SOURCE_COMMIT" --signer-digest "$SOURCE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" '
              .schema_version == "latchway.physical-source-authorization.v1" and
              .repository == $repository and .source.commit == $commit and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt,ref:"refs/heads/main"} and
              .audiences == ["ios-app-attest"] and (.source.tree | test("^[0-9a-f]{40,64}$"))
            ' "$root/source-authorization.json" >/dev/null
          auth_sha=$(shasum -a 256 "$root/source-authorization.json" | awk '{print $1}')
          lease=/etc/latchway/physical-collector/lease.json
          test "$(jq -r '.source_authorization_sha256' "$lease")" = "$auth_sha"
          isolation="$RUNNER_TEMP/latchway-app-attest-isolation"
          install -m 0600 "$root/source-authorization.json" "$isolation/source-authorization.json"
          install -m 0600 "$root/source-authorization.sigstore.json" "$isolation/source-authorization.sigstore.json"
          install -m 0600 "$root/SHA256SUMS" "$isolation/SOURCE_AUTHORIZATION_SHA256SUMS"
      - name: Check out exact iOS candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify protected toolchain and immutable commit
        env:
          EXPECTED_XCODE_IDENTITY: ${{ vars.LATCHWAY_XCODE_IDENTITY }}
          EXPECTED_COMMIT: ${{ vars.LATCHWAY_SOURCE_COMMIT }}
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUESTED_COMMIT" = "$EXPECTED_COMMIT"
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(jq -r '.source.tree' "$RUNNER_TEMP/latchway-app-attest-source/source-authorization.json")"
          test "$(xcodebuild -version | tr '\n' ' ' | sed 's/[[:space:]]*$//')" = "$EXPECTED_XCODE_IDENTITY"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Verify the distinct single-use run-bound device grants
        shell: bash
        env:
          REGISTRATION_GRANT: ${{ secrets.LATCHWAY_REGISTRATION_DEVICE_GRANT }}
          REGISTRATION_GRANT_SHA256: ${{ vars.LATCHWAY_REGISTRATION_DEVICE_GRANT_SHA256 }}
          ASSERTION_GRANT: ${{ secrets.LATCHWAY_ASSERTION_DEVICE_GRANT }}
          ASSERTION_GRANT_SHA256: ${{ vars.LATCHWAY_ASSERTION_DEVICE_GRANT_SHA256 }}
        run: |
          set -Eeuo pipefail
          registration_grant="$REGISTRATION_GRANT"
          assertion_grant="$ASSERTION_GRANT"
          unset REGISTRATION_GRANT ASSERTION_GRANT
          export -n registration_grant assertion_grant
          test -n "$registration_grant" && test -n "$assertion_grant"
          test "$registration_grant" != "$assertion_grant"
          [[ "$REGISTRATION_GRANT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ASSERTION_GRANT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$REGISTRATION_GRANT_SHA256" != "$ASSERTION_GRANT_SHA256"
          test "$(printf '%s' "$registration_grant" | shasum -a 256 | awk '{print $1}')" = "$REGISTRATION_GRANT_SHA256"
          test "$(printf '%s' "$assertion_grant" | shasum -a 256 | awk '{print $1}')" = "$ASSERTION_GRANT_SHA256"
          registration_grant=""
          assertion_grant=""
          unset registration_grant assertion_grant
      - name: Collect and validate production physical-device evidence
        id: collect
        env:
          LATCHWAY_EVIDENCE_OUTPUT_DIR: ${{ runner.temp }}/latchway-app-attest-evidence
          LATCHWAY_IOS_DEVICE_ID: ${{ secrets.LATCHWAY_IOS_DEVICE_ID }}
          LATCHWAY_IOS_APP_BUNDLE_PATH: ${{ vars.LATCHWAY_IOS_APP_BUNDLE_PATH }}
          LATCHWAY_IOS_INSTALL_MODE: ${{ vars.LATCHWAY_IOS_INSTALL_MODE }}
          LATCHWAY_BUNDLE_ID: ${{ vars.LATCHWAY_IOS_BUNDLE_ID }}
          LATCHWAY_IOS_WIDGET_BUNDLE_ID: ${{ vars.LATCHWAY_IOS_WIDGET_BUNDLE_ID }}
          LATCHWAY_IOS_SHARE_BUNDLE_ID: ${{ vars.LATCHWAY_IOS_SHARE_BUNDLE_ID }}
          LATCHWAY_IOS_ACTION_BUNDLE_ID: ${{ vars.LATCHWAY_IOS_ACTION_BUNDLE_ID }}
          LATCHWAY_HOST_COMPONENT_DEFINITION_ID: ${{ vars.LATCHWAY_HOST_COMPONENT_DEFINITION_ID }}
          LATCHWAY_WIDGET_COMPONENT_DEFINITION_ID: ${{ vars.LATCHWAY_WIDGET_COMPONENT_DEFINITION_ID }}
          LATCHWAY_SHARE_COMPONENT_DEFINITION_ID: ${{ vars.LATCHWAY_SHARE_COMPONENT_DEFINITION_ID }}
          LATCHWAY_ACTION_COMPONENT_DEFINITION_ID: ${{ vars.LATCHWAY_ACTION_COMPONENT_DEFINITION_ID }}
          LATCHWAY_APP_VERSION: ${{ vars.LATCHWAY_IOS_APP_VERSION }}
          LATCHWAY_BUILD_NUMBER: ${{ vars.LATCHWAY_IOS_BUILD_NUMBER }}
          LATCHWAY_TEAM_ID: ${{ vars.LATCHWAY_IOS_TEAM_ID }}
          LATCHWAY_APP_ID_PREFIX: ${{ vars.LATCHWAY_IOS_APP_ID_PREFIX }}
          LATCHWAY_IOS_HOST_PROVISIONING_PROFILE_UUID: ${{ vars.LATCHWAY_IOS_HOST_PROVISIONING_PROFILE_UUID }}
          LATCHWAY_IOS_WIDGET_PROVISIONING_PROFILE_UUID: ${{ vars.LATCHWAY_IOS_WIDGET_PROVISIONING_PROFILE_UUID }}
          LATCHWAY_IOS_SHARE_PROVISIONING_PROFILE_UUID: ${{ vars.LATCHWAY_IOS_SHARE_PROVISIONING_PROFILE_UUID }}
          LATCHWAY_IOS_ACTION_PROVISIONING_PROFILE_UUID: ${{ vars.LATCHWAY_IOS_ACTION_PROVISIONING_PROFILE_UUID }}
          LATCHWAY_SIGNING_CERTIFICATE_SHA256: ${{ vars.LATCHWAY_IOS_SIGNING_CERTIFICATE_SHA256 }}
          LATCHWAY_APP_BINARY_SHA256: ${{ vars.LATCHWAY_IOS_APP_BINARY_SHA256 }}
          LATCHWAY_IOS_APP_BUNDLE_TREE_SHA256: ${{ vars.LATCHWAY_IOS_APP_BUNDLE_TREE_SHA256 }}
          LATCHWAY_IOS_WIDGET_BINARY_SHA256: ${{ vars.LATCHWAY_IOS_WIDGET_BINARY_SHA256 }}
          LATCHWAY_IOS_SHARE_BINARY_SHA256: ${{ vars.LATCHWAY_IOS_SHARE_BINARY_SHA256 }}
          LATCHWAY_IOS_ACTION_BINARY_SHA256: ${{ vars.LATCHWAY_IOS_ACTION_BINARY_SHA256 }}
          LATCHWAY_DISTRIBUTION: ${{ vars.LATCHWAY_IOS_DISTRIBUTION }}
          LATCHWAY_SOURCE_COMMIT: ${{ vars.LATCHWAY_SOURCE_COMMIT }}
          LATCHWAY_CORE_COMMIT: ${{ vars.LATCHWAY_CORE_COMMIT }}
          LATCHWAY_SDK_VERSION: ${{ vars.LATCHWAY_IOS_SDK_VERSION }}
          LATCHWAY_CONTRACT_VERSION: ${{ vars.LATCHWAY_CONTRACT_VERSION }}
          LATCHWAY_CONTRACT_BUNDLE_SHA256: ${{ vars.LATCHWAY_CONTRACT_BUNDLE_SHA256 }}
          LATCHWAY_GATEWAY_IMAGE_DIGEST: ${{ vars.LATCHWAY_GATEWAY_IMAGE_DIGEST }}
          LATCHWAY_GATEWAY_CONFIGURATION_SHA256: ${{ vars.LATCHWAY_GATEWAY_CONFIGURATION_SHA256 }}
          LATCHWAY_GATEWAY_ORIGIN: ${{ vars.LATCHWAY_GATEWAY_ORIGIN }}
          LATCHWAY_GATEWAY_DEPLOYMENT_KEY_ID: ${{ vars.LATCHWAY_GATEWAY_DEPLOYMENT_KEY_ID }}
          LATCHWAY_GATEWAY_DEPLOYMENT_STATEMENT_SHA256: ${{ vars.LATCHWAY_GATEWAY_DEPLOYMENT_STATEMENT_SHA256 }}
          LATCHWAY_GATEWAY_DEPLOYMENT_PUBLIC_KEY_PATH: ${{ vars.LATCHWAY_GATEWAY_DEPLOYMENT_PUBLIC_KEY_PATH }}
          LATCHWAY_GATEWAY_DEPLOYMENT_PUBLIC_KEY_SHA256: ${{ vars.LATCHWAY_GATEWAY_DEPLOYMENT_PUBLIC_KEY_SHA256 }}
          LATCHWAY_GATEWAY_MINIMUM_TRUST_LEVEL: ${{ vars.LATCHWAY_GATEWAY_MINIMUM_TRUST_LEVEL }}
          LATCHWAY_BASE_URL: ${{ vars.LATCHWAY_BASE_URL }}
          LATCHWAY_APPLICATION_ID: ${{ vars.LATCHWAY_APPLICATION_ID }}
          LATCHWAY_ENVIRONMENT: ${{ vars.LATCHWAY_ENVIRONMENT }}
          LATCHWAY_IDENTITY_PROVIDER: ${{ vars.LATCHWAY_IDENTITY_PROVIDER }}
          LATCHWAY_REGISTRATION_DEVICE_GRANT_SHA256: ${{ vars.LATCHWAY_REGISTRATION_DEVICE_GRANT_SHA256 }}
          LATCHWAY_ASSERTION_DEVICE_GRANT_SHA256: ${{ vars.LATCHWAY_ASSERTION_DEVICE_GRANT_SHA256 }}
          LATCHWAY_COLLECTOR_TRUST_ROOT_PATH: ${{ runner.temp }}/latchway-collector-trust-root.pem
          LATCHWAY_COLLECTOR_TRUST_ROOT_SHA256: ${{ vars.LATCHWAY_COLLECTOR_TRUST_ROOT_SHA256 }}
          LATCHWAY_REGISTRATION_IDENTITY_TOKEN: ${{ secrets.LATCHWAY_REGISTRATION_DEVICE_GRANT }}
          LATCHWAY_ASSERTION_IDENTITY_TOKEN: ${{ secrets.LATCHWAY_ASSERTION_DEVICE_GRANT }}
          LATCHWAY_FEATURE: ${{ vars.LATCHWAY_FEATURE }}
          LATCHWAY_ERROR_MAPPING_FEATURE: ${{ vars.LATCHWAY_ERROR_MAPPING_FEATURE }}
          LATCHWAY_MODEL: ${{ vars.LATCHWAY_MODEL }}
          LATCHWAY_RUN_ID: app-attest-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/run-physical-app-attest.sh
      - name: Wipe device app data even when collection fails
        if: ${{ always() }}
        shell: bash
        env:
          LATCHWAY_IOS_DEVICE_ID: ${{ secrets.LATCHWAY_IOS_DEVICE_ID }}
          LATCHWAY_BUNDLE_ID: ${{ vars.LATCHWAY_IOS_BUNDLE_ID }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -Eeuo pipefail
          isolation="$RUNNER_TEMP/latchway-app-attest-isolation"
          install -d -m 0700 "$isolation"
          uninstall="$RUNNER_TEMP/latchway-ios-uninstall.json"
          inventory="$RUNNER_TEMP/latchway-ios-post-wipe-apps.json"
          started=$(date +%s)
          xcrun devicectl device uninstall app \
            --device "$LATCHWAY_IOS_DEVICE_ID" \
            --timeout 60 --json-output "$uninstall" \
            --omit-deprecated-fields-in-json "$LATCHWAY_BUNDLE_ID" >/dev/null
          jq --exit-status '.info.outcome == "success"' "$uninstall" >/dev/null
          xcrun devicectl device info apps \
            --device "$LATCHWAY_IOS_DEVICE_ID" --bundle-id "$LATCHWAY_BUNDLE_ID" \
            --include-all-apps --timeout 30 --json-output "$inventory" \
            --omit-deprecated-fields-in-json >/dev/null
          jq --exit-status --arg bundle "$LATCHWAY_BUNDLE_ID" \
            '[.. | strings | select(. == $bundle)] | length == 0' "$inventory" >/dev/null
          wipe="$isolation/device-wipe.json"
          jq -n -S \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" \
            --arg runner "$RUNNER_NAME" \
            --argjson started "$started" \
            --argjson finished "$(date +%s)" \
            '{schema_version:"latchway.physical-device-wipe.v1",repository:$repository,source_commit:$commit,workflow:{run_id:$run_id,run_attempt:$run_attempt,job:$job,audience:"ios-app-attest"},runner_name:$runner,method:"ios-uninstall",app_data_wiped:true,application_absent:true,started_at_unix:$started,finished_at_unix:$finished}' \
            > "$wipe"
      - name: Unconditionally finalize, deregister, and arm collector destruction
        if: ${{ always() }}
        shell: bash
        env:
          LATCHWAY_IOS_DEVICE_ID: ${{ secrets.LATCHWAY_IOS_DEVICE_ID }}
          LATCHWAY_BUNDLE_ID: ${{ vars.LATCHWAY_IOS_BUNDLE_ID }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -Eeuo pipefail
          isolation="$RUNNER_TEMP/latchway-app-attest-isolation"
          evidence="$RUNNER_TEMP/latchway-app-attest-evidence"
          source="$RUNNER_TEMP/latchway-app-attest-source"
          hook=/usr/local/libexec/latchway-physical-collector-finalize
          install -d -m 0700 "$isolation"
          "$hook" \
            --lease /etc/latchway/physical-collector/lease.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job "$GITHUB_JOB" --audience ios-app-attest \
            --runner-name "$RUNNER_NAME" \
            --source-authorization "$source/source-authorization.json" \
            --evidence-directory "$evidence" \
            --device-wipe-receipt "$isolation/device-wipe.json" \
            --device-platform ios --device-selector "$LATCHWAY_IOS_DEVICE_ID" \
            --application-id "$LATCHWAY_BUNDLE_ID" \
            --output-json "$isolation/collector-teardown.json" \
            --output-signature "$isolation/collector-teardown.sig"
          trust_root="$RUNNER_TEMP/latchway-collector-trust-root.pem"
          test -f "$trust_root" && test ! -L "$trust_root"
          openssl dgst -sha256 -verify "$trust_root" \
            -signature "$isolation/collector-teardown.sig" \
            "$isolation/collector-teardown.json"
          auth_sha=$(shasum -a 256 "$isolation/source-authorization.json" | awk '{print $1}')
          lease_sha=$(shasum -a 256 "$isolation/collector-lease.json" | awk '{print $1}')
          wipe_sha=$(shasum -a 256 "$isolation/device-wipe.json" | awk '{print $1}')
          evidence_sha=$(shasum -a 256 "$evidence/SHA256SUMS" | awk '{print $1}')
          device_sha=$(shasum -a 256 "$evidence/device-inventory.json" | awk '{print $1}')
          provider_sha=$(shasum -a 256 "$evidence/app-attest-observation.json" | awk '{print $1}')
          component_sha=$(shasum -a 256 "$evidence/component-observation.json" | awk '{print $1}')
          deployment_sha=$(shasum -a 256 "$evidence/gateway-deployment-verification.json" | awk '{print $1}')
          now=$(date +%s)
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" \
            --arg runner "$RUNNER_NAME" \
            --arg auth "$auth_sha" \
            --arg lease "$lease_sha" \
            --arg wipe "$wipe_sha" \
            --arg evidence "$evidence_sha" \
            --arg device "$device_sha" --arg provider "$provider_sha" \
            --arg component "$component_sha" \
            --arg deployment "$deployment_sha" \
            --argjson now "$now" '
              .schema_version == "latchway.physical-collector-teardown.v1" and
              .repository == $repository and .source_commit == $commit and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt,job:$job,audience:"ios-app-attest"} and
              .runner.name == $runner and .runner.deregistered == true and
              .runner.accepts_more_jobs == false and .runner.destroy_scheduled == true and
              .runner.destroy_deadline_unix >= $now and .runner.destroy_deadline_unix <= ($now + 600) and
              .evidence_eligible == true and
              .supervisor == {private_key_isolated:true,caller_supplied_claims_accepted:false,independent_device_verification:true,independent_provider_verification:true,independent_component_verification:true,gateway_run_receipt_verified:true,one_use_invocation:true,watchdog_armed:true} and
              .observations.device_inventory_sha256 == $device and
              .observations.provider_observation_sha256 == $provider and
              .observations.component_observation_sha256 == $component and
              .observations.gateway_deployment_verification_sha256 == $deployment and
              (.observations.gateway_run_receipt_sha256 | test("^[0-9a-f]{64}$")) and
              .device == {app_data_wiped:true,method:"ios-uninstall",receipt_sha256:$wipe} and
              .source_authorization_sha256 == $auth and .lease_sha256 == $lease and
              .evidence_manifest_sha256 == $evidence
            ' "$isolation/collector-teardown.json" >/dev/null
          cd "$isolation"
          shasum -a 256 \
            SOURCE_AUTHORIZATION_SHA256SUMS \
            collector-lease.json collector-lease.sig \
            collector-teardown.json collector-teardown.sig \
            device-wipe.json source-authorization.json \
            source-authorization.sigstore.json > ISOLATION_SHA256SUMS
          test "${{ steps.collect.outcome }}" = success
      - name: Retain bounded unsigned physical evidence for the fresh signer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-attest-physical-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-app-attest-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Retain the bounded unsigned collector-isolation proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-attest-collector-isolation-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-app-attest-isolation/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  attest:
    name: Attest validated App Attest evidence
    needs: app-attest-production
    if: github.ref == 'refs/heads/main'
    environment: physical-evidence-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download unsigned evidence without a checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-attest-physical-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-app-attest-evidence
      - name: Download collector-isolation proof without a checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-attest-collector-isolation-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-app-attest-isolation
      - name: Validate source authorization, one-job lease, wipe, and teardown
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTOR_TRUST_ROOT_PEM: ${{ vars.LATCHWAY_COLLECTOR_TRUST_ROOT_PEM }}
          COLLECTOR_TRUST_ROOT_SHA256: ${{ vars.LATCHWAY_COLLECTOR_TRUST_ROOT_SHA256 }}
          REGISTRATION_GRANT_SHA256: ${{ vars.LATCHWAY_REGISTRATION_DEVICE_GRANT_SHA256 }}
          ASSERTION_GRANT_SHA256: ${{ vars.LATCHWAY_ASSERTION_DEVICE_GRANT_SHA256 }}
          EXPECTED_ARTIFACT_SHA256: ${{ vars.LATCHWAY_IOS_APP_BINARY_SHA256 }}
          EXPECTED_BUNDLE_TREE_SHA256: ${{ vars.LATCHWAY_IOS_APP_BUNDLE_TREE_SHA256 }}
          EXPECTED_WIDGET_SHA256: ${{ vars.LATCHWAY_IOS_WIDGET_BINARY_SHA256 }}
          EXPECTED_SHARE_SHA256: ${{ vars.LATCHWAY_IOS_SHARE_BINARY_SHA256 }}
          EXPECTED_ACTION_SHA256: ${{ vars.LATCHWAY_IOS_ACTION_BINARY_SHA256 }}
          EXPECTED_APPLICATION_ID: ${{ vars.LATCHWAY_APPLICATION_ID }}
          EXPECTED_ENVIRONMENT: ${{ vars.LATCHWAY_ENVIRONMENT }}
          EXPECTED_IDENTITY_PROVIDER: ${{ vars.LATCHWAY_IDENTITY_PROVIDER }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/latchway-app-attest-isolation"
          evidence="$RUNNER_TEMP/latchway-app-attest-evidence"
          [[ "$EXPECTED_BUNDLE_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -d "$root" && test ! -L "$root"
          test -z "$(find "$root" -mindepth 1 ! -type f -print -quit)"
          expected="$RUNNER_TEMP/app-attest-isolation-expected"
          printf '%s\n' \
            ISOLATION_SHA256SUMS SOURCE_AUTHORIZATION_SHA256SUMS \
            collector-lease.json collector-lease.sig \
            collector-teardown.json collector-teardown.sig \
            device-wipe.json source-authorization.json \
            source-authorization.sigstore.json | LC_ALL=C sort > "$expected"
          find "$root" -mindepth 1 -maxdepth 1 -type f -print \
            | sed "s#^$root/##" | LC_ALL=C sort > "$RUNNER_TEMP/app-attest-isolation-actual"
          cmp --silent "$expected" "$RUNNER_TEMP/app-attest-isolation-actual"
          (cd "$root" && shasum -a 256 -c ISOLATION_SHA256SUMS)
          (cd "$root" && sha256sum --check --strict SOURCE_AUTHORIZATION_SHA256SUMS)
          gh attestation verify "$root/source-authorization.json" \
            --bundle "$root/source-authorization.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/physical-app-attest.yml" \
            --source-digest "$SOURCE_COMMIT" --signer-digest "$SOURCE_COMMIT" \
            --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null
          trust_root="$RUNNER_TEMP/latchway-collector-trust-root.pem"
          umask 077
          printf '%s\n' "$COLLECTOR_TRUST_ROOT_PEM" > "$trust_root"
          [[ "$COLLECTOR_TRUST_ROOT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$trust_root" | awk '{print $1}')" = "$COLLECTOR_TRUST_ROOT_SHA256"
          openssl dgst -sha256 -verify "$trust_root" \
            -signature "$root/collector-lease.sig" "$root/collector-lease.json"
          openssl dgst -sha256 -verify "$trust_root" \
            -signature "$root/collector-teardown.sig" "$root/collector-teardown.json"
          auth_sha=$(sha256sum "$root/source-authorization.json" | awk '{print $1}')
          lease_sha=$(sha256sum "$root/collector-lease.json" | awk '{print $1}')
          wipe_sha=$(sha256sum "$root/device-wipe.json" | awk '{print $1}')
          evidence_sha=$(sha256sum "$evidence/SHA256SUMS" | awk '{print $1}')
          device_sha=$(sha256sum "$evidence/device-inventory.json" | awk '{print $1}')
          provider_sha=$(sha256sum "$evidence/app-attest-observation.json" | awk '{print $1}')
          component_sha=$(sha256sum "$evidence/component-observation.json" | awk '{print $1}')
          deployment_sha=$(sha256sum "$evidence/gateway-deployment-verification.json" | awk '{print $1}')
          runner="latchway-ios-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg runner "$runner" '
              .schema_version == "latchway.physical-source-authorization.v1" and
              .repository == $repository and .source.commit == $commit and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt,ref:"refs/heads/main"} and
              .audiences == ["ios-app-attest"] and (.source.tree | test("^[0-9a-f]{40,64}$"))
            ' "$root/source-authorization.json" >/dev/null
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg runner "$runner" \
            --arg auth "$auth_sha" \
            --arg registration_grant "$REGISTRATION_GRANT_SHA256" \
            --arg assertion_grant "$ASSERTION_GRANT_SHA256" \
            --arg artifact "$EXPECTED_ARTIFACT_SHA256" \
            --arg bundle_tree "$EXPECTED_BUNDLE_TREE_SHA256" \
            --arg widget "$EXPECTED_WIDGET_SHA256" \
            --arg share "$EXPECTED_SHARE_SHA256" \
            --arg action "$EXPECTED_ACTION_SHA256" \
            --arg application "$EXPECTED_APPLICATION_ID" \
            --arg environment "$EXPECTED_ENVIRONMENT" \
            --arg identity_provider "$EXPECTED_IDENTITY_PROVIDER" '
              .schema_version == "latchway.physical-collector-lease.v1" and
              .repository == $repository and .source_commit == $commit and
              .source_authorization_sha256 == $auth and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt,job:"app-attest-production",audience:"ios-app-attest"} and
              .runner.name == $runner and .runner.ephemeral == true and .runner.jit == true and
              .runner.max_jobs == 1 and .runner.fresh_boot == true and .runner.clean_workspace == true and
              .runner.repository_scope == $repository and .runner.device_exclusive == true and
              .runner.destroy_after_job == true and (.runner.image_digest | test("^sha256:[0-9a-f]{64}$")) and
              (.runner.boot_id_sha256 | test("^[0-9a-f]{64}$")) and
              .credentials == {long_lived:false,organization:false,administration:false,registry:false,oidc:false} and
              .supervisor == {private_key_isolated:true,caller_supplied_claims_accepted:false,independent_device_verification:true,independent_provider_verification:true,independent_component_verification:true,gateway_run_receipt_verification:true,one_use_invocation:true,out_of_band_watchdog:true,destroy_on_disconnect:true} and
              (.grants | keys) == ["assertion","registration"] and
              .grants.registration == {audience:"latchway-physical-evidence/ios-app-attest/registration",application_id:$application,environment:$environment,identity_provider:$identity_provider,source_commit:$commit,run_id:$run_id,run_attempt:$run_attempt,sha256:$registration_grant,single_use:true,jti_sha256:.grants.registration.jti_sha256,issued_at_unix:.grants.registration.issued_at_unix,expires_at_unix:.grants.registration.expires_at_unix} and
              .grants.assertion == {audience:"latchway-physical-evidence/ios-app-attest/assertion",application_id:$application,environment:$environment,identity_provider:$identity_provider,source_commit:$commit,run_id:$run_id,run_attempt:$run_attempt,sha256:$assertion_grant,single_use:true,jti_sha256:.grants.assertion.jti_sha256,issued_at_unix:.grants.assertion.issued_at_unix,expires_at_unix:.grants.assertion.expires_at_unix} and
              $registration_grant != $assertion_grant and
              (.grants.registration.jti_sha256 | test("^[0-9a-f]{64}$")) and
              (.grants.assertion.jti_sha256 | test("^[0-9a-f]{64}$")) and
              .grants.registration.jti_sha256 != .grants.assertion.jti_sha256 and
              (.grants.registration.issued_at_unix | type == "number") and
              (.grants.registration.expires_at_unix | type == "number") and
              .grants.registration.issued_at_unix >= .issued_at_unix and
              .grants.registration.expires_at_unix > .grants.registration.issued_at_unix and
              (.grants.registration.expires_at_unix - .grants.registration.issued_at_unix) <= 300 and
              .grants.registration.expires_at_unix <= .expires_at_unix and
              (.grants.assertion.issued_at_unix | type == "number") and
              (.grants.assertion.expires_at_unix | type == "number") and
              .grants.assertion.issued_at_unix >= .issued_at_unix and
              .grants.assertion.expires_at_unix > .grants.assertion.issued_at_unix and
              (.grants.assertion.expires_at_unix - .grants.assertion.issued_at_unix) <= 300 and
              .grants.assertion.expires_at_unix <= .expires_at_unix and
              .candidate.artifacts == {ios_app_binary_sha256:$artifact,ios_app_bundle_tree_sha256:$bundle_tree,ios_widget_binary_sha256:$widget,ios_share_binary_sha256:$share,ios_action_binary_sha256:$action} and
              .candidate.configuration == {application_id:$application,environment:$environment,identity_provider:$identity_provider} and
              (.candidate | keys) == ["artifacts","configuration"] and
              (.expires_at_unix - .issued_at_unix) <= 3600
            ' "$root/collector-lease.json" >/dev/null
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg runner "$runner" \
            --arg wipe "$wipe_sha" '
              .schema_version == "latchway.physical-device-wipe.v1" and
              .repository == $repository and .source_commit == $commit and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt,job:"app-attest-production",audience:"ios-app-attest"} and
              .runner_name == $runner and .method == "ios-uninstall" and
              .app_data_wiped == true and .application_absent == true and
              .started_at_unix <= .finished_at_unix
            ' "$root/device-wipe.json" >/dev/null
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg runner "$runner" \
            --arg auth "$auth_sha" \
            --arg lease "$lease_sha" \
            --arg wipe "$wipe_sha" \
            --arg evidence "$evidence_sha" --arg device "$device_sha" \
            --arg provider "$provider_sha" --arg component "$component_sha" \
            --arg deployment "$deployment_sha" '
              .schema_version == "latchway.physical-collector-teardown.v1" and
              .repository == $repository and .source_commit == $commit and
              .workflow == {run_id:$run_id,run_attempt:$run_attempt,job:"app-attest-production",audience:"ios-app-attest"} and
              .runner.name == $runner and .runner.deregistered == true and
              .runner.accepts_more_jobs == false and .runner.destroy_scheduled == true and
              .runner.destroy_deadline_unix >= .finished_at_unix and
              .runner.destroy_deadline_unix <= (.finished_at_unix + 600) and
              .evidence_eligible == true and
              .supervisor == {private_key_isolated:true,caller_supplied_claims_accepted:false,independent_device_verification:true,independent_provider_verification:true,independent_component_verification:true,gateway_run_receipt_verified:true,one_use_invocation:true,watchdog_armed:true} and
              .observations.device_inventory_sha256 == $device and
              .observations.provider_observation_sha256 == $provider and
              .observations.component_observation_sha256 == $component and
              .observations.gateway_deployment_verification_sha256 == $deployment and
              (.observations.gateway_run_receipt_sha256 | test("^[0-9a-f]{64}$")) and
              .device == {app_data_wiped:true,method:"ios-uninstall",receipt_sha256:$wipe} and
              .source_authorization_sha256 == $auth and .lease_sha256 == $lease and
              .evidence_manifest_sha256 == $evidence and
              (.finished_at_unix | type == "number")
            ' "$root/collector-teardown.json" >/dev/null
          lease_issued=$(jq -r '.issued_at_unix' "$root/collector-lease.json")
          lease_expires=$(jq -r '.expires_at_unix' "$root/collector-lease.json")
          wipe_started=$(jq -r '.started_at_unix' "$root/device-wipe.json")
          teardown_finished=$(jq -r '.finished_at_unix' "$root/collector-teardown.json")
          (( lease_issued <= wipe_started && lease_expires >= teardown_finished ))
          jq -n -S \
            --arg repository "$GITHUB_REPOSITORY" --arg commit "$SOURCE_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg auth "$auth_sha" --arg lease "$lease_sha" --arg teardown "$(sha256sum "$root/collector-teardown.json" | awk '{print $1}')" \
            --arg evidence "$evidence_sha" --arg bundle_tree "$EXPECTED_BUNDLE_TREE_SHA256" \
            '{schema_version:"latchway.physical-collector-isolation-validation.v1",valid:true,repository:$repository,source_commit:$commit,workflow:{run_id:$run_id,run_attempt:$run_attempt,audience:"ios-app-attest"},source_authorization_sha256:$auth,lease_sha256:$lease,teardown_sha256:$teardown,evidence_manifest_sha256:$evidence,application_bundle_tree_sha256:$bundle_tree}' \
            > "$root/collector-isolation-validation.json"
      - name: Validate the fixed receipt, hashes, and coordinates without candidate code
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_RUN_ID: app-attest-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_BUNDLE_TREE_SHA256: ${{ vars.LATCHWAY_IOS_APP_BUNDLE_TREE_SHA256 }}
          EXPECTED_APPLICATION_ID: ${{ vars.LATCHWAY_APPLICATION_ID }}
          EXPECTED_ENVIRONMENT: ${{ vars.LATCHWAY_ENVIRONMENT }}
          EXPECTED_IDENTITY_PROVIDER: ${{ vars.LATCHWAY_IDENTITY_PROVIDER }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/latchway-app-attest-evidence"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BUNDLE_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -d "$root" && test ! -L "$root"
          test -z "$(find "$root" -mindepth 1 ! -type f -print -quit)"
          expected="$RUNNER_TEMP/app-attest-expected-files"
          actual="$RUNNER_TEMP/app-attest-actual-files"
          payloads="$RUNNER_TEMP/app-attest-expected-payloads"
          printf '%s\n' \
            SHA256SUMS \
            app-attest-evidence.json \
            app-attest-junit.xml \
            app-attest-observation.json \
            app-attest-profile.json \
            app-attest-validation.json \
            component-observation.json \
            device-inventory.json \
            gateway-client-policy.json \
            gateway-deployment-public-key.pem \
            gateway-deployment-statement.json \
            gateway-deployment-statement.sig \
            gateway-deployment-verification.json | LC_ALL=C sort > "$expected"
          find "$root" -mindepth 1 -maxdepth 1 -type f -print \
            | sed "s#^$root/##" | LC_ALL=C sort > "$actual"
          cmp --silent "$expected" "$actual"
          grep -v '^SHA256SUMS$' "$expected" > "$payloads"
          total=0
          while IFS= read -r name; do
            bytes=$(stat -c '%s' "$root/$name")
            (( bytes > 0 && bytes <= 33554432 ))
            total=$((total + bytes))
          done < "$expected"
          (( total <= 62914560 ))
          manifest="$root/SHA256SUMS"
          test -z "$(tail -c 1 "$manifest")"
          checksum_names="$RUNNER_TEMP/app-attest-checksum-names"
          : > "$checksum_names"
          while IFS= read -r line; do
            [[ "$line" =~ ^([0-9a-f]{64})\ \ ([A-Za-z0-9][A-Za-z0-9._-]{0,127})$ ]]
            digest=${BASH_REMATCH[1]}
            name=${BASH_REMATCH[2]}
            test -f "$root/$name" && test ! -L "$root/$name"
            test "$(sha256sum "$root/$name" | awk '{print $1}')" = "$digest"
            printf '%s\n' "$name" >> "$checksum_names"
          done < "$manifest"
          LC_ALL=C sort -o "$checksum_names" "$checksum_names"
          test -z "$(uniq -d "$checksum_names")"
          cmp --silent "$payloads" "$checksum_names"
          for document in "$root"/*.json; do jq --exit-status . "$document" >/dev/null; done
          evidence_sha=$(sha256sum "$root/app-attest-evidence.json" | awk '{print $1}')
          component_sha=$(sha256sum "$root/component-observation.json" | awk '{print $1}')
          jq --exit-status --arg commit "$SOURCE_COMMIT" --arg bundle_tree "$EXPECTED_BUNDLE_TREE_SHA256" \
            --arg application "$EXPECTED_APPLICATION_ID" --arg environment "$EXPECTED_ENVIRONMENT" \
            --arg identity_provider "$EXPECTED_IDENTITY_PROVIDER" '
            .schema_version == "latchway.physical-device-profile.v2" and
            .platform == "ios_app_attest" and
            .repository == "Latchway/latchway-ios-sdk" and
            .source.commit == $commit and .source.worktree_clean == true and
            .application_bundle_tree_sha256 == $bundle_tree and
            .expected_pins.latchway_application_id == $application and
            .expected_pins.latchway_environment == $environment and
            .expected_pins.identity_provider == $identity_provider
          ' "$root/app-attest-profile.json" >/dev/null
          jq --exit-status --arg commit "$SOURCE_COMMIT" --arg run "$EXPECTED_RUN_ID" --arg component "$component_sha" --arg bundle_tree "$EXPECTED_BUNDLE_TREE_SHA256" \
            --arg application "$EXPECTED_APPLICATION_ID" --arg environment "$EXPECTED_ENVIRONMENT" \
            --arg identity_provider "$EXPECTED_IDENTITY_PROVIDER" '
            .component_runtime as $runtime |
            .schema_version == "latchway.physical-device-evidence.v2" and
            .release_eligible == true and .platform == "ios_app_attest" and
            .run.id == $run and .run.mode == "release" and
            .source.repository == "Latchway/latchway-ios-sdk" and
            .source.commit == $commit and .source.worktree_clean == true and
            .device.physical == true and .device.simulator == false and
            .device.emulator == false and .device.testing == false and
            .device.debugger_attached == false and
            .provider.name == "app_attest" and .provider.environment == "production" and
            .provider.trust_level == "app_verified" and .provider.request_hash_bound == true and
            ($runtime.identities | map(.role) | sort) == ["action","host","share","widget"] and
            ([$runtime.identities[] | select(.role == "host" and .attestation_mode == "root_app_attest")] | length) == 1 and
            ([$runtime.identities[] | select(.role != "host" and .attestation_mode == "delegated_only")] | length) == 3 and
            $runtime.widget_delegated_execution.role == "widget" and
            $runtime.widget_delegated_execution.trust_source == "delegated_from_attested_root" and
            ($runtime.widget_delegated_execution.http_status >= 200 and $runtime.widget_delegated_execution.http_status <= 299) and
            $runtime.share_delegated_execution.role == "share" and
            $runtime.share_delegated_execution.trust_source == "delegated_from_attested_root" and
            ($runtime.share_delegated_execution.http_status >= 200 and $runtime.share_delegated_execution.http_status <= 299) and
            $runtime.delegated_execution.role == "action" and
            $runtime.delegated_execution.trust_source == "delegated_from_attested_root" and
            ($runtime.delegated_execution.http_status >= 200 and $runtime.delegated_execution.http_status <= 299) and
            ([$runtime.widget_delegated_execution.request_id,$runtime.share_delegated_execution.request_id,$runtime.delegated_execution.request_id] | unique | length) == 3 and
            $runtime.sibling_denial.http_status == 401 and
            $runtime.sibling_denial.error_code == "component_key_invalid" and
            $runtime.keychain_sibling_denial.requesting_role == "action" and
            ($runtime.keychain_sibling_denial.target_role == "widget" or $runtime.keychain_sibling_denial.target_role == "share") and
            $runtime.keychain_sibling_denial.operation == "SecItemCopyMatching" and
            $runtime.keychain_sibling_denial.os_status == -34018 and
            $runtime.keychain_sibling_denial.os_status_name == "errSecMissingEntitlement" and
            $runtime.keychain_sibling_denial.key_material_returned == false and
            ([$runtime.identities[] | select(.role == $runtime.keychain_sibling_denial.target_role and .dpop_key_id_sha256 == $runtime.keychain_sibling_denial.target_key_id_sha256)] | length) == 1 and
            $runtime.component_refresh_race.requests_started_concurrently == true and
            $runtime.component_refresh_race.overlap_observed == true and
            $runtime.component_refresh_race.results_identical == true and
            ($runtime.component_refresh_race.requests | length) == 2 and
            $runtime.component_refresh_race.requests[0].request_id != $runtime.component_refresh_race.requests[1].request_id and
            ($runtime.component_refresh_race.requests | all(.http_status >= 200 and .http_status <= 299)) and
            $runtime.component_refresh_race.requests[0].access_credential_sha256 == $runtime.component_refresh_race.requests[1].access_credential_sha256 and
            $runtime.component_refresh_race.requests[0].refresh_credential_sha256 == $runtime.component_refresh_race.requests[1].refresh_credential_sha256 and
            $runtime.component_refresh_race.requests[0].session_id_sha256 == $runtime.component_refresh_race.requests[1].session_id_sha256 and
            $runtime.component_refresh_race.requests[0].session_id_sha256 == $runtime.component_refresh_race.session_id_after_sha256 and
            $runtime.component_refresh_race.requests[0].refresh_credential_sha256 != $runtime.component_refresh_race.old_credential_sha256 and
            $runtime.lifecycle == {host_process_running_during_action_request:false,background_execution_observed:true,host_termination_observed:true,user_presence_prompt_observed:false} and
            .artifacts.component_observation_sha256 == $component and
            .artifacts.application_bundle_tree_sha256 == $bundle_tree and
            ([.pins[] | select(.name == "latchway_application_id" and .expected == $application and .observed == $application and .matched == true)] | length) == 1 and
            ([.pins[] | select(.name == "latchway_environment" and .expected == $environment and .observed == $environment and .matched == true)] | length) == 1 and
            ([.pins[] | select(.name == "identity_provider" and .expected == $identity_provider and .observed == $identity_provider and .matched == true)] | length) == 1 and
            (.tests | type == "array" and length > 0 and all(.[]; .status == "passed")) and
            (.redaction | type == "object" and all(.[]; . == false))
          ' "$root/app-attest-evidence.json" >/dev/null
          jq --exit-status --arg run "$EXPECTED_RUN_ID" '
            .runtime as $runtime |
            .schema_version == "latchway.ios-component-observation.v2" and
            .platform == "ios_app_attest" and .run_id == $run and
            ($runtime | type == "object") and
            (.tests | type == "array" and length == 13 and all(.[]; .status == "passed")) and
            ([.tests[].id] | sort) == ["action_delegated_request","component_background_execution","component_candidate_identities","component_host_termination","component_key_isolation","component_keychain_sibling_denied","component_no_host_process","component_no_user_presence","component_refresh_race","component_session_isolation","component_sibling_denied","share_delegated_request","widget_delegated_request"] and
            ([.tests[] | select(.id == "widget_delegated_request" and .http_status == $runtime.widget_delegated_execution.http_status and .request_id == $runtime.widget_delegated_execution.request_id)] | length) == 1 and
            ([.tests[] | select(.id == "share_delegated_request" and .http_status == $runtime.share_delegated_execution.http_status and .request_id == $runtime.share_delegated_execution.request_id)] | length) == 1 and
            ([.tests[] | select(.id == "action_delegated_request" and .http_status == $runtime.delegated_execution.http_status and .request_id == $runtime.delegated_execution.request_id)] | length) == 1 and
            ([.tests[] | select(.id == "component_keychain_sibling_denied" and .os_status == $runtime.keychain_sibling_denial.os_status and .os_status_name == $runtime.keychain_sibling_denial.os_status_name)] | length) == 1 and
            ([.tests[] | select(.id == "component_refresh_race" and .concurrent_request_count == 2 and .credential_before_sha256 == $runtime.component_refresh_race.old_credential_sha256 and .credential_after_sha256 == $runtime.component_refresh_race.requests[0].refresh_credential_sha256)] | length) == 1
          ' "$root/component-observation.json" >/dev/null
          jq --exit-status --slurpfile component "$root/component-observation.json" '
            .component_runtime == $component[0].runtime
          ' "$root/app-attest-evidence.json" >/dev/null
          jq --exit-status --arg commit "$SOURCE_COMMIT" --arg run "$EXPECTED_RUN_ID" --arg sha "$evidence_sha" '
            .schema_version == "latchway.physical-device-validation.v1" and
            .valid == true and .platform == "ios_app_attest" and
            .source_commit == $commit and .run_id == $run and
            .evidence_sha256 == $sha and .errors == []
          ' "$root/app-attest-validation.json" >/dev/null
      - name: Attest the exact validated profile, evidence, and checksum manifest
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            ${{ runner.temp }}/latchway-app-attest-evidence/app-attest-profile.json
            ${{ runner.temp }}/latchway-app-attest-evidence/app-attest-evidence.json
            ${{ runner.temp }}/latchway-app-attest-evidence/component-observation.json
            ${{ runner.temp }}/latchway-app-attest-evidence/SHA256SUMS
            ${{ runner.temp }}/latchway-app-attest-isolation/collector-isolation-validation.json
      - name: Retain the GitHub Sigstore bundle with the report
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/latchway-app-attest-evidence"
          destination="$root/github-attestation.sigstore.json"
          test -f "$BUNDLE_PATH" && test ! -L "$BUNDLE_PATH"
          install -m 0600 -- "$BUNDLE_PATH" "$destination"
          install -m 0600 -- "$BUNDLE_PATH" "$RUNNER_TEMP/latchway-app-attest-isolation/github-isolation-attestation.sigstore.json"
          bytes=$(stat -c '%s' "$destination")
          (( bytes > 0 && bytes <= 4194304 ))
          test "$(find "$root" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 14
          test -z "$(find "$root" -mindepth 1 ! -type f -print -quit)"
          total=$(find "$root" -type f -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          (( total <= 67108864 ))
      - name: Retain redacted evidence, JUnit, profiles, hashes, and attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-attest-physical-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-app-attest-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain the independently signed collector-isolation proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-attest-collector-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-app-attest-isolation/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
