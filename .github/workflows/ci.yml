name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Scan the exact candidate dependency inventory offline
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: scripts/scan-dependencies.sh "$SOURCE_COMMIT"
      - name: Toolchain identity
        run: |
          xcodebuild -version
          swift --version
      - name: Install pinned Tuist and actionlint
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: true
          cache: false
      - name: Validate every workflow with pinned actionlint
        run: |
          actionlint_version=$(actionlint -version | sed -n '1p')
          test "$actionlint_version" = "1.7.12"
          actionlint -shellcheck= -pyflakes= -oneline .github/workflows/*.yml
      - name: Compile production App Attest host and all extensions without signing
        env:
          TUIST_LATCHWAY_APP_ATTEST_ENVIRONMENT: production
        run: |
          test "$(tuist version)" = "4.200.4"
          tuist generate --path Examples/AppAttestConformance --no-open
          xcodebuild -quiet \
            -project Examples/AppAttestConformance/AppAttestConformance.xcodeproj \
            -scheme AppAttestConformance \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/latchway-app-attest-host" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test fail-closed physical evidence policy
        run: |
          python3 scripts/test-dependency-vulnerability-scan.py
          python3 scripts/test-device-evidence.py
          python3 scripts/test-physical-evidence-workflow.py
          python3 scripts/test-verify-gateway-deployment.py
          python3 -m py_compile scripts/inspect-physical-app-attest-candidate.py scripts/physical_app_bundle_tree.py
          bash -n scripts/build-physical-app-attest-candidate.sh scripts/gateway-deployment-evidence.sh scripts/run-physical-app-attest.sh
      - name: Verify SwiftPM products and CocoaPods metadata
        run: scripts/verify-package.sh

  pinned-core-conformance:
    name: Pinned core Docker and PostgreSQL conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: docker.io/library/postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: latchway
          POSTGRES_USER: latchway
          POSTGRES_PASSWORD: latchway-ios-pr-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U latchway -d latchway"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LATCHWAY_CONFORMANCE_DATABASE_URL: postgres://latchway:latchway-ios-pr-ci@127.0.0.1:5432/latchway?sslmode=disable
    steps:
      - name: Check out the iOS SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve the exact locked core revision
        id: core
        shell: bash
        run: |
          set -euo pipefail
          commit=$(awk '$1 == "core_commit:" {print $2}' contract.lock)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Check out only the exact locked core revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway
          ref: ${{ steps.core.outputs.commit }}
          path: _core
          persist-credentials: false
      - name: Load the contract bundle and run the exact core image vertical
        env:
          LATCHWAY_SDK_KIND: ios
          LATCHWAY_CORE_DIR: _core
          LATCHWAY_EVIDENCE_DIR: ${{ runner.temp }}/latchway-ios-pr-core-conformance
        run: sh scripts/run-pr-core-conformance.sh
      - name: Retain exact-image conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-ios-pr-core-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-ios-pr-core-conformance/
          if-no-files-found: error
          retention-days: 14

  ios-sdk-live-conformance:
    name: iOS SDK live debug vertical (native macOS, no Docker claim)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the iOS SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve the exact locked core revision
        id: core
        run: |
          set -euo pipefail
          commit=$(awk '$1 == "core_commit:" {print $2}' contract.lock)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Check out only the exact locked core revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway
          ref: ${{ steps.core.outputs.commit }}
          path: _core
          persist-credentials: false
      - name: Install the core Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: _core/go.mod
          cache-dependency-path: _core/go.sum
      - name: Install PostgreSQL 18 for the native macOS vertical
        run: brew install postgresql@18
      - name: Drive the native core through the actual iOS SDK
        env:
          LATCHWAY_CORE_DIR: _core
          LATCHWAY_EVIDENCE_DIR: ${{ runner.temp }}/latchway-ios-pr-native-live-conformance
        run: |
          export LATCHWAY_POSTGRES_BIN="$(brew --prefix postgresql@18)/bin"
          sh scripts/run-pr-ios-live-conformance.sh
      - name: Retain native iOS SDK live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-ios-pr-native-live-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-ios-pr-native-live-conformance/
          if-no-files-found: error
          retention-days: 14
