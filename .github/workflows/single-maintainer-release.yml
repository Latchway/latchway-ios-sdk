name: Single-maintainer v1 release

on:
  workflow_dispatch:
    inputs:
      release_profile:
        description: Explicit lower-assurance publication profile
        required: true
        type: choice
        options: [single_maintainer_v1]
      release_commit:
        description: Exact 40-character main commit to publish
        required: true
        type: string
      release_version:
        description: Must be 1.0.0
        required: true
        default: 1.0.0
        type: string
      confirmation:
        description: Type publish-v1.0.0-with-deferred-assurance
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-single-maintainer-v1-${{ inputs.release_commit }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: 1.0.0
  RELEASE_TAG: v1.0.0

jobs:
  intent:
    name: Bind explicit deferred-assurance intent to exact main source
    if: github.repository == 'Latchway/latchway-ios-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      commit: ${{ steps.intent.outputs.commit }}
      core_commit: ${{ steps.intent.outputs.core_commit }}
      intent_sha256: ${{ steps.intent.outputs.intent_sha256 }}
      tag: ${{ steps.intent.outputs.tag }}
      version: ${{ steps.intent.outputs.version }}
    steps:
      - name: Authenticate this exact main workflow run before candidate checkout
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,15}$ ]]
          (( GITHUB_RUN_ID <= 9007199254740991 ))
          (( GITHUB_RUN_ATTEMPT <= 9007199254740991 ))
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/run.json"
          jq --exit-status --arg commit "$RELEASE_COMMIT" --argjson run "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" '
              .id == $run and .run_attempt == $attempt and .event == "workflow_dispatch" and
              .status == "in_progress" and .head_sha == $commit and .head_branch == "main" and
              .repository.full_name == "Latchway/latchway-ios-sdk" and
              .head_repository.full_name == "Latchway/latchway-ios-sdk" and
              (.workflow_id | type == "number" and . > 0)
            ' "$RUNNER_TEMP/run.json" >/dev/null
          workflow_id=$(jq --raw-output .workflow_id "$RUNNER_TEMP/run.json")
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/workflow.json"
          jq --exit-status '.path == ".github/workflows/single-maintainer-release.yml" and .state == "active"' \
            "$RUNNER_TEMP/workflow.json" >/dev/null
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify explicit single-maintainer request without credentials
        id: intent
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_COMMIT_INPUT: ${{ inputs.release_commit }}
          RELEASE_PROFILE_INPUT: ${{ inputs.release_profile }}
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: >-
          python3 scripts/verify-maintainer-release.py
          --repository-id ios --repository-name "$GITHUB_REPOSITORY"
          --profile "$RELEASE_PROFILE_INPUT"
          --release-commit "$RELEASE_COMMIT_INPUT"
          --release-version "$RELEASE_VERSION_INPUT"
          --workflow-commit "$GITHUB_SHA" --workflow-ref "$GITHUB_REF"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --confirmation "$CONFIRMATION"
          --intent-output "$RUNNER_TEMP/latchway-single-maintainer-v1-intent.json"
          --github-output "$GITHUB_OUTPUT"
      - name: Reject a v1 tag owned by another workflow transaction
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.intent.outputs.commit }}
          INTENT_SHA256: ${{ steps.intent.outputs.intent_sha256 }}
        run: |
          set -euo pipefail
          message="Latchway iOS SDK v1.0.0

          Release profile: single_maintainer_v1
          Assurance: deferred; not release-qualified or independently reviewed
          Maintainer intent SHA-256: $INTENT_SHA256"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/existing-tag-ref.json" 2> "$RUNNER_TEMP/existing-tag-error"; then
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/existing-tag-error"
            exit 0
          fi
          test "$(jq -r .object.type "$RUNNER_TEMP/existing-tag-ref.json")" = tag
          object=$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/existing-tag-ref.json")
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" > "$RUNNER_TEMP/existing-tag-object.json"
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg message "$message" \
            '.tag==$tag and .object.type=="commit" and .object.sha==$commit and .message==$message' \
            "$RUNNER_TEMP/existing-tag-object.json" >/dev/null
      - id: artifact
        run: printf 'name=ios-maintainer-intent-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/latchway-single-maintainer-v1-intent.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  verify-source:
    name: Run complete iOS and CocoaPods source gate before mutation
    needs: intent
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.intent.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan exact dependency inventory
        env:
          LATCHWAY_OSV_EVIDENCE_PATH: ${{ runner.temp }}/dependency-vulnerability-scan.json
          SOURCE_COMMIT: ${{ needs.intent.outputs.commit }}
        run: scripts/scan-dependencies.sh "$SOURCE_COMMIT"
      - name: Run the complete offline Swift, consumer, and four-subspec CocoaPods gate
        run: scripts/verify-package.sh

  core-release-gate:
    name: Authenticate the exact public core v1 evidence before mutation
    needs: intent
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.intent.outputs.commit }}
          persist-credentials: false
      - name: Verify the public single-maintainer core record, supply chain, Compose, and Cloud Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-public-core-release.sh "${{ needs.intent.outputs.core_commit }}" "$RUNNER_TEMP/public-core-v1"

  tag:
    name: Create or verify exact annotated deferred-assurance tag
    needs: [intent, verify-source, core-release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: single-maintainer-v1
    permissions:
      contents: write
    steps:
      - name: Verify exact lower-assurance environment before tag mutation
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway-ios-sdk:single-maintainer-v1"
      - name: Create or adopt only the exact annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          REQUESTED_COMMIT: ${{ inputs.release_commit }}
          RELEASE_COMMIT: ${{ needs.intent.outputs.commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_COMMIT" = "$REQUESTED_COMMIT"
          test "$RELEASE_COMMIT" = "$WORKFLOW_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_COMMIT"
          message="Latchway iOS SDK v1.0.0

          Release profile: single_maintainer_v1
          Assurance: deferred; not release-qualified or independently reviewed
          Maintainer intent SHA-256: $INTENT_SHA256"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/ref.json" 2> "$RUNNER_TEMP/ref.err"; then
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/ref.err"
            jq -n --arg tag "$RELEASE_TAG" --arg message "$message" --arg object "$RELEASE_COMMIT" '{tag:$tag,message:$message,object:$object,type:"commit"}' > "$RUNNER_TEMP/tag.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" --input "$RUNNER_TEMP/tag.json" > "$RUNNER_TEMP/tag-result.json"
            jq -n --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$(jq -r .sha "$RUNNER_TEMP/tag-result.json")" '{ref:$ref,sha:$sha}' > "$RUNNER_TEMP/create-ref.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input "$RUNNER_TEMP/create-ref.json" >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/ref.json"
          fi
          object=$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/ref.json")
          test "$(jq -r .object.type "$RUNNER_TEMP/ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" > "$RUNNER_TEMP/tag-object.json"
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg message "$message" '.tag==$tag and .object.type=="commit" and .object.sha==$commit and .message==$message' "$RUNNER_TEMP/tag-object.json" >/dev/null

  package:
    name: Run complete iOS package and CocoaPods gate
    needs: [intent, tag]
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.intent.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and annotated tag
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "${{ needs.intent.outputs.commit }}"
          scripts/release-preflight.sh "$RELEASE_TAG"
      - name: Run complete offline release and dependency gates
        env:
          LATCHWAY_OSV_EVIDENCE_PATH: ${{ runner.temp }}/dependency-vulnerability-scan.json
          SOURCE_COMMIT: ${{ needs.intent.outputs.commit }}
        run: |
          scripts/scan-dependencies.sh "$SOURCE_COMMIT"
          scripts/verify-package.sh
      - name: Build deterministic source and documentation archives
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/release"
          scripts/build-release-archive.sh "$RELEASE_TAG" "$RUNNER_TEMP/release"
          python3 scripts/build_docs_bundle.py --output-dir "$RUNNER_TEMP/release" --version "$RELEASE_VERSION" --commit "${{ needs.intent.outputs.commit }}" --require-clean
          pod ipc spec Latchway.podspec > "$RUNNER_TEMP/release/cocoapods-reviewed-podspec.json"
          jq --exit-status --arg version "$RELEASE_VERSION" '
            type == "object" and .name == "Latchway" and .version == $version and
            .source == {git: "https://github.com/Latchway/latchway-ios-sdk.git", tag: ("v" + $version)} and
            ([.subspecs[].name] | sort) == ["AppAttest", "AppExtensions", "Core", "FirebaseAuth"] and
            ([.. | objects | has("prepare_command") or has("script_phase") or has("script_phases")] | any | not)
          ' "$RUNNER_TEMP/release/cocoapods-reviewed-podspec.json" >/dev/null
          install -m 600 "$RUNNER_TEMP/dependency-vulnerability-scan.json" "$RUNNER_TEMP/release/"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.intent.outputs.artifact_name }}
          path: ${{ runner.temp }}/intent
      - name: Verify and stage maintainer intent
        env:
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$INTENT_SHA256" "$RUNNER_TEMP/intent/latchway-single-maintainer-v1-intent.json" | shasum -a 256 -c
          install -m 600 "$RUNNER_TEMP/intent/latchway-single-maintainer-v1-intent.json" "$RUNNER_TEMP/release/"
      - name: Seal the exact inert CocoaPods candidate manifest
        env:
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          RELEASE_COMMIT: ${{ needs.intent.outputs.commit }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release"
          archive="$root/latchway-ios-sdk-$RELEASE_VERSION.tar.gz"
          checksum="$archive.sha256"
          podspec="$root/cocoapods-reviewed-podspec.json"
          docs="$root/docs-bundle-$RELEASE_VERSION.tar.gz"
          scan="$root/dependency-vulnerability-scan.json"
          intent="$root/latchway-single-maintainer-v1-intent.json"
          test -z "$(find "$root" -type l -print -quit)"
          for file in "$archive" "$checksum" "$podspec" "$docs" "$scan" "$intent"; do
            test -f "$file" && test ! -L "$file" && test -s "$file"
          done
          test "$(wc -c < "$archive" | tr -d ' ')" -le 67108864
          test "$(wc -c < "$checksum" | tr -d ' ')" -le 1024
          test "$(wc -c < "$podspec" | tr -d ' ')" -le 1048576
          test "$(wc -c < "$docs" | tr -d ' ')" -le 33554432
          test "$(wc -c < "$scan" | tr -d ' ')" -le 8388608
          test "$(wc -c < "$intent" | tr -d ' ')" -le 65536
          test "$(cat "$checksum")" = "$(shasum -a 256 "$archive" | awk '{print $1}')  ${archive##*/}"
          test "$(shasum -a 256 "$intent" | awk '{print $1}')" = "$INTENT_SHA256"
          archive_sha256=$(shasum -a 256 "$archive" | awk '{print $1}')
          checksum_sha256=$(shasum -a 256 "$checksum" | awk '{print $1}')
          podspec_sha256=$(shasum -a 256 "$podspec" | awk '{print $1}')
          docs_sha256=$(shasum -a 256 "$docs" | awk '{print $1}')
          scan_sha256=$(shasum -a 256 "$scan" | awk '{print $1}')
          archive_bytes=$(wc -c < "$archive" | tr -d ' ')
          checksum_bytes=$(wc -c < "$checksum" | tr -d ' ')
          podspec_bytes=$(wc -c < "$podspec" | tr -d ' ')
          docs_bytes=$(wc -c < "$docs" | tr -d ' ')
          scan_bytes=$(wc -c < "$scan" | tr -d ' ')
          intent_bytes=$(wc -c < "$intent" | tr -d ' ')
          jq --null-input \
            --arg commit "$RELEASE_COMMIT" --arg tag "$RELEASE_TAG" --arg version "$RELEASE_VERSION" \
            --arg archive_sha256 "$archive_sha256" --arg checksum_sha256 "$checksum_sha256" \
            --arg podspec_sha256 "$podspec_sha256" --arg docs_sha256 "$docs_sha256" \
            --arg scan_sha256 "$scan_sha256" --arg intent_sha256 "$INTENT_SHA256" \
            --argjson archive_bytes "$archive_bytes" --argjson checksum_bytes "$checksum_bytes" \
            --argjson podspec_bytes "$podspec_bytes" --argjson docs_bytes "$docs_bytes" \
            --argjson scan_bytes "$scan_bytes" --argjson intent_bytes "$intent_bytes" '
            {
              schema: "latchway.ios-single-maintainer-registry-candidate.v1",
              repository: "Latchway/latchway-ios-sdk",
              source_commit: $commit,
              release_tag: $tag,
              version: $version,
              files: {
                archive: {name: ("latchway-ios-sdk-" + $version + ".tar.gz"), sha256: $archive_sha256, bytes: $archive_bytes},
                checksum: {name: ("latchway-ios-sdk-" + $version + ".tar.gz.sha256"), sha256: $checksum_sha256, bytes: $checksum_bytes},
                podspec: {name: "cocoapods-reviewed-podspec.json", sha256: $podspec_sha256, bytes: $podspec_bytes},
                documentation: {name: ("docs-bundle-" + $version + ".tar.gz"), sha256: $docs_sha256, bytes: $docs_bytes},
                dependency_scan: {name: "dependency-vulnerability-scan.json", sha256: $scan_sha256, bytes: $scan_bytes},
                maintainer_intent: {name: "latchway-single-maintainer-v1-intent.json", sha256: $intent_sha256, bytes: $intent_bytes}
              }
            }
          ' > "$root/ios-registry-candidate.json"
          find "$root" -mindepth 1 -maxdepth 1 -type f -print | sed "s#^$root/##" | LC_ALL=C sort > "$RUNNER_TEMP/ios-candidate-files.txt"
          test -z "$(find "$root" -mindepth 2 -print -quit)"
          test -z "$(find "$root" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          printf '%s\n' \
            cocoapods-reviewed-podspec.json \
            dependency-vulnerability-scan.json \
            "docs-bundle-$RELEASE_VERSION.tar.gz" \
            ios-registry-candidate.json \
            "latchway-ios-sdk-$RELEASE_VERSION.tar.gz" \
            "latchway-ios-sdk-$RELEASE_VERSION.tar.gz.sha256" \
            latchway-single-maintainer-v1-intent.json \
            | LC_ALL=C sort > "$RUNNER_TEMP/ios-expected-files.txt"
          cmp "$RUNNER_TEMP/ios-expected-files.txt" "$RUNNER_TEMP/ios-candidate-files.txt"
      - id: artifact
        run: printf 'name=ios-single-maintainer-release-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish-cocoapods:
    name: Publish or adopt exact CocoaPods metadata without candidate checkout
    needs: [intent, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: single-maintainer-v1
    permissions:
      actions: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Verify exact lower-assurance environment before CocoaPods credentials
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway-ios-sdk:single-maintainer-v1"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/ios-registry-candidate
      - name: Validate exact inert candidate without executing package content
        id: candidate
        env:
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          RELEASE_COMMIT: ${{ needs.intent.outputs.commit }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ios-registry-candidate"
          archive="$root/latchway-ios-sdk-$RELEASE_VERSION.tar.gz"
          checksum="$archive.sha256"
          podspec="$root/cocoapods-reviewed-podspec.json"
          docs="$root/docs-bundle-$RELEASE_VERSION.tar.gz"
          scan="$root/dependency-vulnerability-scan.json"
          intent="$root/latchway-single-maintainer-v1-intent.json"
          manifest="$root/ios-registry-candidate.json"
          test -d "$root" && test ! -L "$root"
          test -z "$(find "$root" -type l -print -quit)"
          test -z "$(find "$root" -mindepth 2 -print -quit)"
          test -z "$(find "$root" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          find "$root" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/ios-candidate-files.txt"
          printf '%s\n' \
            cocoapods-reviewed-podspec.json \
            dependency-vulnerability-scan.json \
            "docs-bundle-$RELEASE_VERSION.tar.gz" \
            ios-registry-candidate.json \
            "latchway-ios-sdk-$RELEASE_VERSION.tar.gz" \
            "latchway-ios-sdk-$RELEASE_VERSION.tar.gz.sha256" \
            latchway-single-maintainer-v1-intent.json \
            | LC_ALL=C sort > "$RUNNER_TEMP/ios-expected-files.txt"
          cmp --silent "$RUNNER_TEMP/ios-expected-files.txt" "$RUNNER_TEMP/ios-candidate-files.txt"
          for file in "$archive" "$checksum" "$podspec" "$docs" "$scan" "$intent" "$manifest"; do
            test -f "$file" && test ! -L "$file" && test -s "$file"
          done
          test "$(wc -c < "$archive" | tr -d ' ')" -le 67108864
          test "$(wc -c < "$checksum" | tr -d ' ')" -le 1024
          test "$(wc -c < "$podspec" | tr -d ' ')" -le 1048576
          test "$(wc -c < "$docs" | tr -d ' ')" -le 33554432
          test "$(wc -c < "$scan" | tr -d ' ')" -le 8388608
          test "$(wc -c < "$intent" | tr -d ' ')" -le 65536
          test "$(wc -c < "$manifest" | tr -d ' ')" -le 65536
          test "$(cat "$checksum")" = "$(sha256sum "$archive" | awk '{print $1}')  ${archive##*/}"
          test "$(sha256sum "$intent" | awk '{print $1}')" = "$INTENT_SHA256"
          archive_sha256=$(sha256sum "$archive" | awk '{print $1}')
          checksum_sha256=$(sha256sum "$checksum" | awk '{print $1}')
          podspec_sha256=$(sha256sum "$podspec" | awk '{print $1}')
          docs_sha256=$(sha256sum "$docs" | awk '{print $1}')
          scan_sha256=$(sha256sum "$scan" | awk '{print $1}')
          archive_bytes=$(wc -c < "$archive" | tr -d ' ')
          checksum_bytes=$(wc -c < "$checksum" | tr -d ' ')
          podspec_bytes=$(wc -c < "$podspec" | tr -d ' ')
          docs_bytes=$(wc -c < "$docs" | tr -d ' ')
          scan_bytes=$(wc -c < "$scan" | tr -d ' ')
          intent_bytes=$(wc -c < "$intent" | tr -d ' ')
          jq --exit-status \
            --arg commit "$RELEASE_COMMIT" --arg tag "$RELEASE_TAG" --arg version "$RELEASE_VERSION" \
            --arg archive_sha256 "$archive_sha256" --arg checksum_sha256 "$checksum_sha256" \
            --arg podspec_sha256 "$podspec_sha256" --arg docs_sha256 "$docs_sha256" \
            --arg scan_sha256 "$scan_sha256" --arg intent_sha256 "$INTENT_SHA256" \
            --argjson archive_bytes "$archive_bytes" --argjson checksum_bytes "$checksum_bytes" \
            --argjson podspec_bytes "$podspec_bytes" --argjson docs_bytes "$docs_bytes" \
            --argjson scan_bytes "$scan_bytes" --argjson intent_bytes "$intent_bytes" '
            (keys | sort) == ["files", "release_tag", "repository", "schema", "source_commit", "version"] and
            .schema == "latchway.ios-single-maintainer-registry-candidate.v1" and
            .repository == "Latchway/latchway-ios-sdk" and .source_commit == $commit and
            .release_tag == $tag and .version == $version and
            .files == {
              archive: {name: ("latchway-ios-sdk-" + $version + ".tar.gz"), sha256: $archive_sha256, bytes: $archive_bytes},
              checksum: {name: ("latchway-ios-sdk-" + $version + ".tar.gz.sha256"), sha256: $checksum_sha256, bytes: $checksum_bytes},
              podspec: {name: "cocoapods-reviewed-podspec.json", sha256: $podspec_sha256, bytes: $podspec_bytes},
              documentation: {name: ("docs-bundle-" + $version + ".tar.gz"), sha256: $docs_sha256, bytes: $docs_bytes},
              dependency_scan: {name: "dependency-vulnerability-scan.json", sha256: $scan_sha256, bytes: $scan_bytes},
              maintainer_intent: {name: "latchway-single-maintainer-v1-intent.json", sha256: $intent_sha256, bytes: $intent_bytes}
            }
          ' "$manifest" >/dev/null
          jq --exit-status --arg version "$RELEASE_VERSION" '
            type == "object" and .name == "Latchway" and .version == $version and
            .source == {git: "https://github.com/Latchway/latchway-ios-sdk.git", tag: ("v" + $version)} and
            ([.subspecs[].name] | sort) == ["AppAttest", "AppExtensions", "Core", "FirebaseAuth"] and
            ([.. | objects | has("prepare_command") or has("script_phase") or has("script_phases")] | any | not)
          ' "$podspec" >/dev/null
          shard=$(printf '%s' Latchway | md5sum | cut -c1-3 | sed 's/./&\//g;s#/$##')
          printf 'registry_url=https://cdn.cocoapods.org/Specs/%s/Latchway/%s/Latchway.podspec.json\n' \
            "$shard" "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Determine whether exact CocoaPods metadata already exists
        id: registry
        env:
          REGISTRY_URL: ${{ steps.candidate.outputs.registry_url }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/cocoapods-published-podspec.json"
          code=$(curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 1048576 \
            --silent --show-error --location --output "$output" --write-out '%{http_code}' "$REGISTRY_URL")
          case "$code" in
            200)
              jq --sort-keys . "$output" > "$RUNNER_TEMP/published.sorted.json"
              jq --sort-keys . "$RUNNER_TEMP/ios-registry-candidate/cocoapods-reviewed-podspec.json" > "$RUNNER_TEMP/reviewed.sorted.json"
              cmp --silent "$RUNNER_TEMP/reviewed.sorted.json" "$RUNNER_TEMP/published.sorted.json"
              printf 'upload_required=false\n' >> "$GITHUB_OUTPUT"
              ;;
            404)
              rm -f -- "$output"
              printf 'upload_required=true\n' >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Could not prove CocoaPods registry state (HTTP $code)" >&2; exit 1 ;;
          esac
      - name: Upload only reviewed JSON bytes with the protected Trunk credential
        if: steps.registry.outputs.upload_required == 'true'
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$COCOAPODS_TRUNK_TOKEN"
          auth_config="$RUNNER_TEMP/cocoapods-trunk-auth"
          response="$RUNNER_TEMP/cocoapods-trunk-response.json"
          trap 'rm -f -- "$auth_config"' EXIT
          umask 077
          printf 'header = "Authorization: Token %s"\n' "$COCOAPODS_TRUNK_TOKEN" > "$auth_config"
          unset COCOAPODS_TRUNK_TOKEN
          set +e
          code=$(curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --config "$auth_config" --connect-timeout 15 --max-time 120 --max-filesize 2097152 \
            --silent --show-error --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --header 'Accept: application/json; charset=utf-8' \
            --header 'User-Agent: CocoaPods/1.16.2' \
            --data-binary "@$RUNNER_TEMP/ios-registry-candidate/cocoapods-reviewed-podspec.json" \
            --output "$response" --write-out '%{http_code}' \
            'https://trunk.cocoapods.org/api/v1/pods?allow_warnings=false')
          transport_status=$?
          set -e
          rm -f -- "$auth_config"
          trap - EXIT
          if [[ "$transport_status" -ne 0 ]]; then
            echo "CocoaPods upload outcome is uncertain; exact CDN adoption will decide the result" >&2
          elif [[ ! "$code" =~ ^(200|201|202)$ ]]; then
            echo "CocoaPods upload returned HTTP $code; exact CDN adoption will decide the result" >&2
          fi
      - name: Wait for and retain exact immutable CocoaPods metadata
        env:
          REGISTRY_URL: ${{ steps.candidate.outputs.registry_url }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/cocoapods-published-podspec.json"
          reviewed="$RUNNER_TEMP/ios-registry-candidate/cocoapods-reviewed-podspec.json"
          published=false
          for attempt in $(seq 1 90); do
            if curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 60 --max-filesize 1048576 \
              --fail --silent --show-error --location --output "$output" "$REGISTRY_URL"; then
              jq --sort-keys . "$output" > "$RUNNER_TEMP/published.sorted.json"
              jq --sort-keys . "$reviewed" > "$RUNNER_TEMP/reviewed.sorted.json"
              cmp --silent "$RUNNER_TEMP/reviewed.sorted.json" "$RUNNER_TEMP/published.sorted.json"
              published=true
              break
            fi
            test "$attempt" = 90 || sleep 20
          done
          test "$published" = true
      - name: Seal exact CocoaPods evidence and release assets
        env:
          REGISTRY_URL: ${{ steps.candidate.outputs.registry_url }}
          RELEASE_COMMIT: ${{ needs.intent.outputs.commit }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/ios-registry-candidate"
          destination="$RUNNER_TEMP/ios-single-maintainer-release"
          mkdir -m 700 "$destination"
          install -m 600 -- \
            "$candidate/cocoapods-reviewed-podspec.json" \
            "$candidate/dependency-vulnerability-scan.json" \
            "$candidate/docs-bundle-$RELEASE_VERSION.tar.gz" \
            "$candidate/ios-registry-candidate.json" \
            "$candidate/latchway-ios-sdk-$RELEASE_VERSION.tar.gz" \
            "$candidate/latchway-ios-sdk-$RELEASE_VERSION.tar.gz.sha256" \
            "$candidate/latchway-single-maintainer-v1-intent.json" \
            "$RUNNER_TEMP/cocoapods-published-podspec.json" \
            "$destination/"
          archive_sha256=$(sha256sum "$destination/latchway-ios-sdk-$RELEASE_VERSION.tar.gz" | awk '{print $1}')
          published_sha256=$(sha256sum "$destination/cocoapods-published-podspec.json" | awk '{print $1}')
          reviewed_sha256=$(sha256sum "$destination/cocoapods-reviewed-podspec.json" | awk '{print $1}')
          jq --null-input --arg version "$RELEASE_VERSION" --arg commit "$RELEASE_COMMIT" \
            --arg tag "$RELEASE_TAG" --arg url "$REGISTRY_URL" \
            --arg archive_sha256 "$archive_sha256" --arg published_sha256 "$published_sha256" \
            --arg reviewed_sha256 "$reviewed_sha256" \
            --slurpfile published "$destination/cocoapods-published-podspec.json" '
            {
              schema_version: 1,
              kind: "latchway_cocoapods_release_evidence",
              status: "passed",
              registry: "cocoapods",
              package: "Latchway",
              version: $version,
              published_spec_sha256: $published_sha256,
              reviewed_source_archive_sha256: $archive_sha256,
              published_spec_equals_reviewed_podspec: true,
              reviewed_source_archive_equals_release_tag: true,
              reviewed_spec_sha256: $reviewed_sha256,
              source_commit: $commit,
              source_tag: $tag,
              registry_url: $url,
              source: $published[0].source,
              assurance: "single_maintainer_v1_deferred"
            }
          ' > "$destination/cocoapods-release-evidence.json"
          (
            cd "$destination"
            printf '%s\n' \
              cocoapods-published-podspec.json \
              cocoapods-release-evidence.json \
              cocoapods-reviewed-podspec.json \
              dependency-vulnerability-scan.json \
              "docs-bundle-$RELEASE_VERSION.tar.gz" \
              ios-registry-candidate.json \
              "latchway-ios-sdk-$RELEASE_VERSION.tar.gz" \
              "latchway-ios-sdk-$RELEASE_VERSION.tar.gz.sha256" \
              latchway-single-maintainer-v1-intent.json \
              | LC_ALL=C sort > "$RUNNER_TEMP/ios-release-files.txt"
            while IFS= read -r name; do sha256sum "$name"; done < "$RUNNER_TEMP/ios-release-files.txt" > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
      - id: artifact
        run: printf 'name=ios-single-maintainer-publication-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/ios-single-maintainer-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  github-release:
    name: Publish exact GitHub release with deferred-assurance notice
    needs: [intent, package, publish-cocoapods]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: single-maintainer-v1
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Verify exact lower-assurance environment before OIDC or release mutation
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway-ios-sdk:single-maintainer-v1"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.publish-cocoapods.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
      - name: Validate exact release closure before requesting OIDC
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release"
          test -d "$root" && test ! -L "$root"
          test -z "$(find "$root" -type l -print -quit)"
          find "$root" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/ios-release-files.txt"
          printf '%s\n' \
            SHA256SUMS \
            cocoapods-published-podspec.json \
            cocoapods-release-evidence.json \
            cocoapods-reviewed-podspec.json \
            dependency-vulnerability-scan.json \
            "docs-bundle-$RELEASE_VERSION.tar.gz" \
            ios-registry-candidate.json \
            "latchway-ios-sdk-$RELEASE_VERSION.tar.gz" \
            "latchway-ios-sdk-$RELEASE_VERSION.tar.gz.sha256" \
            latchway-single-maintainer-v1-intent.json \
            | LC_ALL=C sort > "$RUNNER_TEMP/ios-expected-release-files.txt"
          cmp --silent "$RUNNER_TEMP/ios-expected-release-files.txt" "$RUNNER_TEMP/ios-release-files.txt"
          test "$(find "$root" -mindepth 2 -print -quit)" = ""
          (cd "$root" && sha256sum --check --strict SHA256SUMS)
      - uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Resume an exact draft, verify every byte, and finalize once
        env:
          GH_TOKEN: ${{ github.token }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          RELEASE_COMMIT: ${{ needs.intent.outputs.commit }}
        run: |
          set -euo pipefail
          title='Latchway iOS SDK 1.0.0 — single-maintainer v1'
          printf '%s\n' 'Published with the `single_maintainer_v1` profile. External platform/device/provider evidence and independent human review are deferred. This release is not `release_qualified`, fully evidence-gated, or independently reviewed.' > "$RUNNER_TEMP/notes.md"
          message="Latchway iOS SDK v1.0.0

          Release profile: single_maintainer_v1
          Assurance: deferred; not release-qualified or independently reviewed
          Maintainer intent SHA-256: $INTENT_SHA256"
          verify_tag() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-tag-ref.json"
            test "$(jq -r .object.type "$RUNNER_TEMP/release-tag-ref.json")" = tag
            local object
            object=$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/release-tag-ref.json")
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" > "$RUNNER_TEMP/release-tag-object.json"
            jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg message "$message" \
              '.tag==$tag and .object.type=="commit" and .object.sha==$commit and .message==$message' \
              "$RUNNER_TEMP/release-tag-object.json" >/dev/null
          }
          root="$RUNNER_TEMP/release"
          test -z "$(find "$root" -type l -print -quit)"
          find "$root" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/local-assets"
          test -s "$RUNNER_TEMP/local-assets"
          verify_tag
          if ! gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release-error"; then
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/release-error"
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          jq -e --arg title "$title" --rawfile body "$RUNNER_TEMP/notes.md" '
            .tag_name=="v1.0.0" and .name==$title and .body==$body and
            .prerelease==false and (.draft==true or .draft==false)
          ' "$RUNNER_TEMP/release.json" >/dev/null
          jq -r '.assets[].name' "$RUNNER_TEMP/release.json" | while IFS= read -r name; do
            grep --fixed-strings --line-regexp --quiet "$name" "$RUNNER_TEMP/local-assets"
          done
          while IFS= read -r name; do
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
            count=$(jq --arg name "$name" '[.assets[] | select(.name==$name)] | length' "$RUNNER_TEMP/release.json")
            if [[ "$count" = 0 ]]; then
              test "$(jq -r .draft "$RUNNER_TEMP/release.json")" = true
              gh release upload "$RELEASE_TAG" "$root/$name"
            else
              test "$count" = 1
              existing=$(mktemp -d "$RUNNER_TEMP/existing-asset.XXXXXX")
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$existing"
              cmp --silent "$root/$name" "$existing/$name"
            fi
          done < "$RUNNER_TEMP/local-assets"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          jq -r '.assets[].name' "$RUNNER_TEMP/release.json" | LC_ALL=C sort > "$RUNNER_TEMP/remote-assets"
          diff --unified=0 "$RUNNER_TEMP/local-assets" "$RUNNER_TEMP/remote-assets"
          verified=$(mktemp -d "$RUNNER_TEMP/verified-assets.XXXXXX")
          gh release download "$RELEASE_TAG" --dir "$verified"
          diff -qr "$root" "$verified"
          verify_tag
          if [[ "$(jq -r .draft "$RUNNER_TEMP/release.json")" == true ]]; then
            release_id=$(jq -er '.id | select(type=="number" and .>0)' "$RUNNER_TEMP/release.json")
            printf '{"draft":false}\n' > "$RUNNER_TEMP/finalize-release.json"
            gh api --method PATCH -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" --input "$RUNNER_TEMP/finalize-release.json" >/dev/null
          fi
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/final-release.json"
          jq -e --arg title "$title" --rawfile body "$RUNNER_TEMP/notes.md" '
            .tag_name=="v1.0.0" and .name==$title and .body==$body and .draft==false and .prerelease==false
          ' "$RUNNER_TEMP/final-release.json" >/dev/null
          final=$(mktemp -d "$RUNNER_TEMP/final-assets.XXXXXX")
          gh release download "$RELEASE_TAG" --dir "$final"
          diff -qr "$root" "$final"
          verify_tag
