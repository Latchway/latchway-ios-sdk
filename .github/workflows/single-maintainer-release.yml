name: Publish iOS SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: 1.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: ios-publication
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: v${{ inputs.version }}

jobs:
  publish:
    name: Package, publish CocoaPods, and create the GitHub release
    if: github.repository == 'Latchway/latchway-ios-sdk' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    environment: single-maintainer-v1
    permissions:
      contents: write
    steps:
      - name: Check out the release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Create the release tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag --annotate "$RELEASE_TAG" --message "Latchway iOS SDK $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Package the source and CocoaPods metadata
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          archive="$RUNNER_TEMP/release/latchway-ios-sdk-$RELEASE_VERSION.tar.gz"
          git archive --format=tar \
            --prefix="latchway-ios-sdk-$RELEASE_VERSION/" \
            "$RELEASE_TAG" | gzip -9 > "$archive"
          (cd "$RUNNER_TEMP/release" && shasum -a 256 "latchway-ios-sdk-$RELEASE_VERSION.tar.gz") > "$archive.sha256"
          pod ipc spec Latchway.podspec > "$RUNNER_TEMP/release/Latchway.podspec.json"

      - name: Publish Latchway to CocoaPods
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          auth_config="$RUNNER_TEMP/cocoapods-trunk-auth"
          response="$RUNNER_TEMP/cocoapods-trunk-response.json"
          printf 'header = "Authorization: Token %s"\n' "$COCOAPODS_TRUNK_TOKEN" > "$auth_config"
          unset COCOAPODS_TRUNK_TOKEN
          trap 'rm -f -- "$auth_config"' EXIT HUP INT TERM
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --config "$auth_config" --connect-timeout 15 --max-time 120 \
            --silent --show-error --fail --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --header 'Accept: application/json; charset=utf-8' \
            --header 'User-Agent: CocoaPods/1.16.2' \
            --data-binary "@$RUNNER_TEMP/release/Latchway.podspec.json" \
            --output "$response" \
            'https://trunk.cocoapods.org/api/v1/pods?allow_warnings=true'

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/latchway-ios-sdk-$RELEASE_VERSION.tar.gz" \
            "$RUNNER_TEMP/release/latchway-ios-sdk-$RELEASE_VERSION.tar.gz.sha256" \
            "$RUNNER_TEMP/release/Latchway.podspec.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latchway iOS SDK $RELEASE_TAG" \
            --verify-tag --latest \
            --notes-file "docs/release/$RELEASE_TAG.md"
